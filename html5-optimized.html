<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术博客 - 文章详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
            background: linear-gradient(160deg, #f0f6fd 0%, #dbe9fa 100%);
            min-height: 100vh;
            color: #33404e;
        }

        .header {
            background: linear-gradient(135deg, #2b7de0 0%, #00b4d8 100%);
            padding: 42px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: #ffffff;
            letter-spacing: 6px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
            font-weight: 700;
        }

        .welcome {
            text-align: center;
            color: #2b7de0;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 14px 24px 0;
        }

        .nav {
            background: #ffffff;
            box-shadow: 0 2px 10px rgba(43, 125, 224, 0.12);
            padding: 12px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .nav a {
            color: #2b7de0;
            text-decoration: none;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 18px;
            transition: all 0.25s ease;
        }

        .nav a:hover {
            background: #2b7de0;
            color: #ffffff;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 42px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(43, 125, 224, 0.15);
            padding: 30px 36px;
            width: 100%;
            max-width: 720px;
        }

        .card h2 {
            font-size: 1.2rem;
            color: #22303f;
            margin-bottom: 18px;
            padding-left: 12px;
            border-left: 4px solid #2b7de0;
        }

        .article-body h3 {
            font-size: 1.05rem;
            color: #22303f;
            margin: 18px 0 8px;
        }

        .toc {
            background: #f5f9ff;
            border-radius: 8px;
            padding: 14px 18px;
            line-height: 2;
            margin-bottom: 14px;
        }

        .toc ul {
            list-style: none;
            padding-left: 4px;
        }

        .toc a {
            color: #2b7de0;
            text-decoration: none;
            font-weight: 600;
        }

        .toc a:hover {
            text-decoration: underline;
        }

        .article-body {
            line-height: 1.9;
            color: #33404e;
        }

        .article-body p {
            margin-bottom: 12px;
        }

        .article-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            margin: 18px 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #e8f3ff 0%, #d7eeff 100%);
            border: 1px solid #dfeaf9;
            color: #2b7de0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .comment-form .field {
            margin-bottom: 14px;
        }

        .comment-form label {
            display: inline-block;
            margin-bottom: 8px;
            color: #22303f;
            font-weight: 600;
        }

        .comment-form input[type="text"],
        .comment-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d3dce6;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            font-family: inherit;
        }

        .comment-form textarea {
            height: 90px;
            resize: vertical;
        }

        .comment-form input[type="text"]:focus,
        .comment-form textarea:focus {
            border-color: #2b7de0;
            box-shadow: 0 0 0 3px rgba(43, 125, 224, 0.15);
        }

        .comment-form input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2b7de0, #00b4d8);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: opacity 0.25s ease, transform 0.15s ease;
        }

        .comment-form input[type="submit"]:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            padding: 22px;
            color: #6b7a8d;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>技术博客</h1>
    </header>

    <p class="welcome">欢迎阅读本站文章，欢迎留言评论！</p>

    <nav class="nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="contact.html">联系我们</a>
    </nav>

    <main class="main">
        <article class="card" aria-labelledby="article-title">
            <h2 id="article-title">HTML5 学习笔记</h2>
            <nav class="toc" aria-label="文章目录">
                <p><strong>目录：</strong></p>
                <ul>
                    <li><a href="#item1">一、HTML5 简介</a></li>
                    <li><a href="#item2">二、语义化标签</a></li>
                </ul>
            </nav>

            <div class="article-body">
                <p>本笔记介绍 HTML5 的核心特性，适合初学者快速入门。</p>
                <div class="article-visual" role="img" aria-label="HTML5 示例图标">HTML5</div>
                <h3 id="item1">一、HTML5 简介</h3>
                <p>HTML5 是新一代网页标准，支持多媒体、绘图与语义化等丰富特性。</p>
                <h3 id="item2">二、语义化标签</h3>
                <p>在编写网页时，应尽量使用语义化标签，让结构更清晰、更利于 SEO。</p>
            </div>
        </article>

        <section class="card" aria-labelledby="comment-title">
            <h2 id="comment-title">发表评论</h2>
            <form class="comment-form" id="comment-form" method="post" onsubmit="handleSubmit(event)">
                <div class="field">
                    <label for="nickname">昵称：</label>
                    <input id="nickname" type="text" name="nickname" placeholder="请输入昵称" required>
                </div>
                <div class="field">
                    <label for="comment">评论：</label>
                    <textarea id="comment" name="comment" placeholder="说点什么吧..." required></textarea>
                </div>
                <div>
                    <input type="submit" value="提交评论">
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">版权所有 &copy; 2026 某某公司</footer>

    <script>
        // 静态演示：无后端接口时，拦截提交并给出提示，避免请求不存在的 comment.php
        function handleSubmit(e) {
            e.preventDefault();
            alert('评论提交成功（演示：实际项目需接入后端接口处理数据）');
        }
    </script>
</body>
</html>
